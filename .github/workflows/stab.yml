name: stab

# Turán-stability SAT models (scripts/stab.py): is there a union U of two plane triangulations on n
# vertices with independence number <= p whose complement has a Füredi-optimal p-partition with
# the given part sizes? One line "n p s1,..,sp dmin" of the queue per job. A push that changes
# data/stab.env starts a run on the queue and time limit written there.

on:
  push:
    paths: ["data/stab.env"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          . data/stab.env
          echo "parts=$(seq -s, 0 $(( $(grep -c . "$QUEUE") - 1 )) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
  solve:
    needs: plan
    name: Line ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Kissat and CaDiCaL
        run: |
          scripts/get_tools.sh
          pip install -q python-sat networkx
      - name: Solve
        run: |
          . data/stab.env
          mkdir -p out
          line=$(sed -n "$(( ${{ matrix.part }} + 1 ))p" "$QUEUE")
          set -- $line
          python3 scripts/stab.py "$1" "$2" "$3" out/m.cnf "$4"
          s=$(date +%s)
          timeout "$TIMEOUT" build/tools/kissat/build/kissat out/m.cnf > out/m.sol || true
          r=$(grep '^s ' out/m.sol || echo "s UNKNOWN")
          echo "$line $r $(( $(date +%s) - s ))s" | tee out/result.txt
          if grep -q '^s SATISFIABLE' out/m.sol; then python3 scripts/stab_decode.py out/m.sol out/m.cnf.map | tee -a out/result.txt; fi
          rm -f out/m.cnf
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stab-${{ matrix.part }}
          path: out/
